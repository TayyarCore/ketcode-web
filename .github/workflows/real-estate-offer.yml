name: Real estate offer page build
on:
  pull_request:
    paths:
      - 'app/offers/real-estate/**'
      - '.github/workflows/real-estate-offer.yml'
  push:
    branches:
      - 'feature/real-estate-799-sales-page'
    paths:
      - 'app/offers/real-estate/**'
      - '.github/workflows/real-estate-offer.yml'
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm exec tsc -- --noEmit
      - run: npm run build
